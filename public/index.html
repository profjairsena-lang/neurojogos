<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio das Palavras</title>
    <link rel="stylesheet" href="style1.css" />
    <script src="script1.js" defer></script>
  </head>
  <body>
    <div id="setup-screen">
      <!-- ETAPA 1: ESCOLHA DE AVATARES -->
      <div id="step-1">
        <div class="game-title" style="margin-bottom: 20px">
          <img
            src="avatar/textoh1.png"
            alt="Palavra Colorida"
            style="max-width: 100%; height: auto"
          />
          <p style="color: #5b3c11; font-weight: 800; font-size: 15px">
            Escolham seus personagens!
          </p>
        </div>

        <div
          style="display: flex; justify-content: space-around; margin: 30px 0"
        >
          <div style="text-align: center">
            <div
              style="
                border: 6px solid rgb(200,  162,  200);
                box-shadow:
                  0 -6px 6px rgba(0, 0, 0, 0.25),
                  inset 10px 10px 8px -12px rgba(0, 0, 0, 0.8);
                border-radius: 50%;
                width: 110px;
                height: 110px;
                background: #b2e1e4;
                border: none;

                margin: 0;
              "
            >
              <div
                class="av-face"
                id="step1-av1"
                style="width: 100px; height: 100px"
                onclick="openAvPicker(1)"
              ></div>
              <p style="margin-top: 10px; font-weight: 800; color: #2db807">
                Jogador 1
              </p>
            </div>
          </div>
          <div style="text-align: center">
            <div
              style="
                border: 6px solid rgb(200,  162,  200);
                box-shadow:
                  0 -6px 6px rgba(0, 0, 0, 0.25),
                  inset 10px 10px 8px -12px rgba(0, 0, 0, 0.8);
                border-radius: 50%;
                width: 110px;
                height: 110px;
                background: #e4b2d9;
                border: none;

                margin: 0;
              "
            >
              <div
                class="av-face"
                id="step1-av2"
                style="width: 100px; height: 100px"
                onclick="openAvPicker(2)"
              ></div>
              <p style="margin-top: 10px; font-weight: 800; color: #9b59b6">
                Jogador 2
              </p>
            </div>
          </div>
        </div>
        <div
          style="display: flex; justify-content: center; margin-bottom: 20px"
        >
          <button class="start-btn" style="width: 200px" onclick="goToStep2()">
            Próximo Passo ▶
          </button>
        </div>
      </div>

      <!-- ETAPA 2: CONFIGURAÇÕES DE PERFIL -->
      <div id="step-2" style="display: none">
        <div class="game-title">
          <img
            src="avatar/textoh1.png"
            alt="Personalizar Jogadores"
            style="max-width: 100%; height: auto"
          />
        </div>

        <div
          class="player-card pc1"
          style="
            background: url(&quot;avatar/pc1-1.png&quot;) no-repeat
              center/contain;
          "
        >
          <div class="player-top">
            <div class="av-wrap">
              <div class="av-face" id="av1" onclick="openAvPicker(1)">👦</div>
            </div>
            <div class="pf">
              <input
                type="text"
                id="nm1"
                placeholder="Jogador 1"
                maxlength="18"
              />
              <div class="droprow">
                <select id="ano1">
                  <option value="">Ano</option>
                  <option>1º</option>
                  <option>2º</option>
                  <option>3º</option>
                  <option>4º</option>
                  <option>5º</option>
                  <option>6º</option>
                </select>
                <select id="tu1">
                  <option value="">Turma</option>
                  <option>A</option>
                  <option>B</option>
                  <option>C</option>
                  <option>D</option>
                  <option>E</option>
                </select>
              </div>
            </div>
          </div>
          <div class="color-label">Cor das palavras:</div>
          <div class="color-row" id="cr1"></div>
        </div>

        <div
          class="player-card pc2"
          style="
            background: url(&quot;avatar/pc1-2.png&quot;) no-repeat
              center/contain;
          "
        >
          <div class="player-top">
            <div class="av-wrap">
              <div class="av-face" id="av2" onclick="openAvPicker(2)">👽</div>
            </div>
            <div class="pf">
              <input
                type="text"
                id="nm2"
                placeholder="Jogador 2"
                maxlength="18"
              />
              <div class="droprow">
                <select id="ano2">
                  <option value="">Ano</option>
                  <option>1º</option>
                  <option>2º</option>
                  <option>3º</option>
                  <option>4º</option>
                  <option>5º</option>
                  <option>6º</option>
                </select>
                <select id="tu2">
                  <option value="">Turma</option>
                  <option>A</option>
                  <option>B</option>
                  <option>C</option>
                  <option>D</option>
                  <option>E</option>
                </select>
              </div>
            </div>
          </div>
          <div class="color-label">Cor das palavras:</div>
          <div class="color-row" id="cr2"></div>
        </div>
        <!-- botoes do inicio -->
        <div
          style="
            width: 250px;
            align-content: center;
            justify-content: center;
            margin-inline: 20px;
          "
        >
          <div style="display: flex; gap: 5px">
            <button
              class="start-btn"
              style="background: #888; box-shadow: 0 4px 0 #666; flex: 1"
              onclick="goToStep1()"
            >
              ⬅ Voltar
            </button>
            <button class="start-btn" style="flex: 2" onclick="startGame()">
              ▶ Iniciar Jogo
            </button>
          </div>
        </div>
      </div>
      <div id="jnotice" style="display: none" class="json-notice jno"></div>
    </div>

    <!-- Modal -->

    <div class="overlay" id="av-modal">
      <div class="mbox">
        <h2>🎨 Escolher Avatar</h2>
        <div class="av-grid" id="av-grid"></div>
        <button class="mbtn" onclick="closeM('av-modal')">Confirmar</button>
      </div>
    </div>
  </body>
</html>
